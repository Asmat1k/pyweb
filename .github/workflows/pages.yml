name: GitHub Pages

on:
  push:
    branches: [main, quarto]
  pull_request:
    branches: [main, quarto]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render website
        run: quarto render docs
      - uses: actions/upload-pages-artifact@v3
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/quarto') && github.event_name != 'pull_request'
        with:
          path: docs/_site

  deploy:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/quarto') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
