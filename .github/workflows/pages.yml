name: GitHub Pages

on:
  push:
    branches: [main, sphinx]
  pull_request:
    branches: [main, sphinx]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build strictly
        run: python -m sphinx -b dirhtml -W docs site
      - uses: actions/upload-pages-artifact@v3
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/sphinx') && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/sphinx') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
