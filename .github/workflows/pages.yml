name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      healthcheck_marker:
        description: Optional control string override to demonstrate failure
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - name: Test deployment scripts
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build strictly
        run: python -m mkdocs build --strict
      - name: Identify release
        env:
          RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: printf '\n<!-- helios-pyweb release:%s -->\n' "$RELEASE" >> site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Verify published release
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          MARKER: ${{ inputs.healthcheck_marker || 'helios-pyweb' }}
          RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/helios-healthcheck.py "$SITE_URL" "$MARKER" "$RELEASE"
