site_name: WebTransport и WebSocket
site_description: Выбор технологий WebTransport и WebSocket для двунаправленной передачи данных в веб-приложениях.
site_author: Asmat1k
site_url: !ENV [SITE_URL, 'https://asmat1k.github.io/pyweb/']
repo_url: https://github.com/Asmat1k/pyweb
repo_name: Asmat1k/pyweb
edit_uri: edit/main/docs/
use_directory_urls: true

theme:
  name: material
  language: ru
  font: false
  icon:
    logo: material/swap-horizontal
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

nav:
  - Главная: index.md
  - Область сравнения: about.md
  - Методика: methodology.md
  - WebSocket: websocket.md
  - WebTransport: webtransport.md
  - Сценарии экспериментов: scenarios.md
  - Результаты: results.md
  - Ограничения: limitations.md
  - Источники: references.md

plugins:
  - search:
      lang: [ru, en]

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
