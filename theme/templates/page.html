<!doctype html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ SITEDESCRIPTION|e }}">
  <title>{{ page.title|e }} — {{ SITENAME|e }}</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; line-height: 1.6; }
    body { max-width: 90rem; margin: auto; padding: 1.5rem; }
    a { color: light-dark(#2949a8, #a9baff); }
    header { border-bottom: 1px solid #888; padding-bottom: 1rem; }
    .layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 2rem; }
    nav ul { list-style: none; padding-left: 0; }
    nav li { margin: .4rem 0; }
    nav a[aria-current] { font-weight: bold; }
    main { min-width: 0; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #888; padding: .5rem; text-align: left; }
    pre { overflow-x: auto; padding: 1rem; background: light-dark(#f1f3f8, #20232b); }
    .admonition { border-left: .3rem solid #5b8bbd; padding: .5rem 1rem; background: light-dark(#eef5fc, #202d3a); }
    .admonition-title { font-weight: bold; }
    .headerlink { margin-left: .5rem; text-decoration: none; }
    @media (max-width: 50rem) { .layout { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <header><a href="{{ SITEURL }}/index.html">{{ SITENAME|e }}</a> · <a href="https://github.com/Asmat1k/pyweb">Asmat1k/pyweb</a></header>
  <div class="layout">
    <nav aria-label="Разделы сайта">
      {% for group, items in NAVIGATION %}
      {% if group %}<h2>{{ group|e }}</h2>{% endif %}
      <ul>
        {% for title, url in items %}
        <li><a href="{{ SITEURL }}/{{ url }}"{% if page.url == url %} aria-current="page"{% endif %}>{{ title|e }}</a></li>
        {% endfor %}
      </ul>
      {% endfor %}
    </nav>
    <main>{{ page.content }}</main>
  </div>
</body>
</html>
